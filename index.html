<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>到账音效模拟器</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
 background:#0e1116;color:#e8eef7;display:flex;flex-direction:column;align-items:center;
 min-height:100vh;padding:18px 16px 30px}
h1{font-size:19px;font-weight:600;margin:6px 0 2px;letter-spacing:.5px}
.sub{font-size:12px;color:#7d8898;margin-bottom:16px}
.tabs{display:flex;background:#171c24;border-radius:14px;padding:4px;width:100%;max-width:420px;margin-bottom:18px}
.tab{flex:1;text-align:center;padding:11px 0;border-radius:11px;font-size:15px;font-weight:600;
 color:#8b95a5;cursor:pointer;transition:.18s}
.tab.on{color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.tab.on.alipay{background:#1677ff}
.tab.on.wechat{background:#07c160}
.card{width:100%;max-width:420px;background:#171c24;border-radius:18px;padding:18px}
label{font-size:12px;color:#7d8898;display:block;margin-bottom:8px}
#amt{width:100%;background:#0e1116;border:1px solid #26303d;border-radius:12px;color:#fff;
 font-size:30px;font-weight:700;text-align:center;padding:14px 10px;outline:none;letter-spacing:1px}
#amt:focus{border-color:#3a4a5f}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.q{background:#1f2731;border:none;color:#c8d3e0;font-size:13px;padding:10px 0;border-radius:10px;
 cursor:pointer;font-weight:600}
.q:active{background:#2b3644}
.btn{width:100%;margin-top:16px;border:none;border-radius:14px;color:#fff;font-size:18px;
 font-weight:700;padding:16px 0;cursor:pointer;letter-spacing:2px;transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn.alipay{background:linear-gradient(135deg,#1677ff,#0a5bdb);box-shadow:0 8px 22px rgba(22,119,255,.3)}
.btn.wechat{background:linear-gradient(135deg,#07c160,#049a4c);box-shadow:0 8px 22px rgba(7,193,96,.28)}
.row{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:#8b95a5}
input[type=range]{flex:1;accent-color:#1677ff}
.tip{margin-top:22px;font-size:11.5px;color:#5d6878;line-height:1.7;max-width:420px;text-align:center}
.pulse{animation:pl .45s ease}
@keyframes pl{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
.status{margin-top:12px;font-size:12.5px;color:#8b95a5;text-align:center;min-height:18px;word-break:break-all;line-height:1.5}
.status.bad{color:#ff7b72}
.diag{margin-top:10px;font-size:11px;color:#4d5768;text-align:center;cursor:pointer;padding:6px 0}
.diag:active{color:#8b95a5}
</style>
</head>
<body>
<h1>到账音效模拟器</h1>
<div class="sub">支付宝原声拼接 · 微信语音合成</div>

<div class="tabs">
  <div class="tab alipay on" id="tabA" onclick="setMode('alipay')">支付宝</div>
  <div class="tab wechat" id="tabW" onclick="setMode('wechat')">微信</div>
</div>

<div class="card">
  <label>金额（元）</label>
  <input id="amt" value="100" inputmode="decimal" autocomplete="off">
  <div class="quick">
    <button class="q" onclick="setAmt('0.01')">0.01</button>
    <button class="q" onclick="setAmt('1')">1</button>
    <button class="q" onclick="setAmt('8.88')">8.88</button>
    <button class="q" onclick="setAmt('50')">50</button>
    <button class="q" onclick="setAmt('88')">88</button>
    <button class="q" onclick="setAmt('100')">100</button>
    <button class="q" onclick="setAmt('520')">520</button>
    <button class="q" onclick="setAmt('10000')">1万</button>
  </div>
  <button class="btn alipay" id="playBtn" onclick="play()">播 报</button>
  <div class="status" id="status">正在加载音频…</div>
  <div class="row"><span>音量</span><input type="range" id="vol" min="0" max="100" value="100"></div>
  <div class="diag" onclick="diag()">没声音？点这里自检</div>
</div>

<div class="tip">音效仅用于短视频拍摄 / 直播氛围 / 音频测试。<br>用它骗人收款属于诈骗，后果自负。</div>

var mode = 'alipay';
var ctx = null, buffers = {}, master = null, playing = [];
var audioReady = false, pendingPlay = null, pendingTimer = null;

function $(id){ return document.getElementById(id); }

function vol(){
  var el = $('vol');
  return ((el && el.value) || 100) / 100;
}

function setStatus(t, cls){
  var el = $('status');
  if (!el) return;
  el.textContent = t;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

function setMode(m){
  mode = m;
  var a = $('tabA'), w = $('tabW'), b = $('playBtn');
  a.className = 'tab alipay' + (m === 'alipay' ? ' on' : '');
  w.className = 'tab wechat' + (m === 'wechat' ? ' on' : '');
  b.className = 'btn ' + m;
}
function setAmt(v){ $('amt').value = v; }

function b64ToBuf(b64){
  var bin = atob(b64), u = new Uint8Array(bin.length), i;
  for (i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}

function createCtx(){
  if (ctx) return ctx;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { setStatus('这个浏览器放不了音频，换 Chrome 试试', 'bad'); return null; }
  try {
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = vol();
    master.connect(ctx.destination);
  } catch(e){
    setStatus('音频初始化失败：' + e.message, 'bad');
    return null;
  }
  return ctx;
}

function kick(){
  if (ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch(e){} }
}

function decodeOne(key){

    var arr;
    try { arr = b64ToBuf(AUDIO[key]); } catch(e){ return resolve(); }

  var n = 0, k;
  for (k in buffers){ if (buffers.hasOwnProperty(k)) n++; }

}

  var out = '', zero = false, started = false, i, d;
  for (i = 3; i >= 0; i--){
    d = Math.floor(part / Math.pow(10,i)) % 10;
    if (d === 0){
      if (started) zero = true;
    } else {
      if (zero) { out += '零'; zero = false; }
      out += CN[d] + units[i];
      started = true;
    }
  }
  return out;
}

function amountToKeys(str){
  str = String(str).trim().replace(/[^\d.]/g,'');
  if (!str || str === '.') return ['success','0','yuan'];
  var parts = str.split('.');
  var ip = parts[0] || '0';
  var dp = (parts[1] || '').slice(0,2);
  var keys = [], idx, ch;
  var map = { '零':'0','一':'1','二':'2','三':'3','四':'4','五':'5',
              '六':'6','七':'7','八':'8','九':'9',
              '十':'ten','百':'hundred','千':'thousand',
              '万':'ten_thousand','亿':'ten_million' };
  var cn = intToCn(parseInt(ip, 10) || 0);
  for (idx = 0; idx < cn.length; idx++){
    ch = cn.charAt(idx);
    if (map[ch]) keys.push(map[ch]);
  }
  if (dp && parseInt(dp,10) !== 0){
    keys.push('dot');
    for (idx = 0; idx < dp.length; idx++) keys.push(String(parseInt(dp.charAt(idx),10)));
  }
  keys.push('yuan');
  keys.unshift('success');
  return keys;
}

/* ---------- 播放 ---------- */
function stopAll(){
  playing.forEach(function(n){ try{ n.stop(); }catch(e){} });
  playing = [];
  if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch(e){} }
  if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
}

function playKeys(keys, silentStatus){
  if (!ctx) return;
  var t = ctx.currentTime + 0.05, i, buf, src, played = 0;
  for (i = 0; i < keys.length; i++){
    buf = buffers[keys[i]];
    if (!buf) continue;
    src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(master);
    src.start(t);
    playing.push(src);
    t += buf.duration;
    played++;
  }
  if (!silentStatus && played) setStatus('已播报 · 共 ' + played + ' 段发音');
  else if (!played) setStatus('音频没准备好，点「没声音？点这里自检」看看', 'bad');
}

function ding(){
  if (!ctx) return;
  var t = ctx.currentTime, i, o, g, f;
  for (i = 0; i < 2; i++){
    f = i ? 1320 : 880;
    o = ctx.createOscillator();
    g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + 0.16 * i);
    g.gain.exponentialRampToValueAtTime(0.30, t + 0.16 * i + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16 * i + 0.20);
    o.connect(g);
    g.connect(master);
    o.start(t + 0.16 * i);
    o.stop(t + 0.16 * i + 0.22);
  }
}

function play(){
  stopAll();
  var v = $('amt').value;
  var btn = $('playBtn');
  btn.classList.remove('pulse'); void btn.offsetWidth; btn.classList.add('pulse');

  if (!createCtx()) return;
  kick();                       // 必须在点击手势里同步唤醒

  if (mode === 'wechat'){ playWechat(v); return; }

  if (!audioReady){
    setStatus('音频还在加载，好了自动播…');
    pendingPlay = v;
    return;
  }
  playKeys(amountToKeys(v));
}

function playNow(v){
  if (!ctx) return;
  kick();
  if (!audioReady){ pendingPlay = v; return; }
  playKeys(amountToKeys(v));
}

function playWechat(v){
  var n = parseFloat(v || '0');
  var txt = '微信支付收款' + (isNaN(n) ? '0' : n.toFixed(2)) + '元';

  // 1) APK 内桥接（系统 TTS）
  if (window.PaySound && window.PaySound.speak){
    var ok = true;
    try {
      if (typeof window.PaySound.ttsReady === 'function' && !window.PaySound.ttsReady()) ok = false;
    } catch(e){}
    if (ok){ try { window.PaySound.speak(txt); setStatus('已播报（系统语音）'); return; } catch(e){} }
  }

  // 2) 浏览器 speechSynthesis（要有中文语音包）
  if ('speechSynthesis' in window){
    var all = speechSynthesis.getVoices(), pick = null, i;
    for (i = 0; i < all.length; i++){
      if (/zh|Chinese/i.test(all[i].lang)){
        pick = all[i];
        if (/女|female|Xiao|Hui|Ya/i.test(all[i].name)) break;
      }
    }
    if (pick){
      var u = new SpeechSynthesisUtterance(txt);
      u.lang = 'zh-CN';
      u.rate = 1.02;
      u.pitch = 1.05;
      u.volume = vol();
      u.voice = pick;
      speechSynthesis.speak(u);
      setStatus('已播报（手机自带语音包）');
      return;
    }
  }

  // 3) 兜底：提示音 + 素材金额，保证能出声
  var keys = amountToKeys(v);
  keys = keys.slice(1);          // 去掉"支付宝到账"那句，只念金额
  ding();
  setStatus('已播报（没装中文语音包，用提示音+金额）');
  pendingTimer = setTimeout(function(){ pendingTimer = null; playKeys(keys, true); }, 320);
}

function diag(){
  var ua = navigator.userAgent;
  var cm = ua.match(/Chrome\/[\d.]+/);
  var msg = [
    '音频引擎:' + (ctx ? ctx.state : '未创建'),
    '音频段:' + countBuf() + '/18',
    '语音包:' + (('speechSynthesis' in window) ? speechSynthesis.getVoices().length : '不支持'),
    '音量:' + vol().toFixed(2),
    '浏览器:' + (cm ? cm[0] : ua.slice(0, 24))
  ].join(' · ');
  setStatus(msg, 'bad');
}

$('vol').addEventListener('input', function(e){
  if (master) master.gain.value = e.target.value / 100;
});
$('amt').addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.target.blur(); play(); }
});
if ('speechSynthesis' in window){
  try { speechSynthesis.getVoices(); } catch(e){}
}

// 页面一打开就预解码，点的时候立刻响
setTimeout(warmup, 60);
if (document.readyState === 'complete') setTimeout(warmup, 60);
else window.addEventListener('load', function(){ setTimeout(warmup, 60); });
</script>
